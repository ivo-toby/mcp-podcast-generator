services:
  mcp-podcast-generator:
    build: .
    ports:
      - "3000:3000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OUTPUT_DIR=/output
      - TEMP_DIR=/tmp/podcast-gen
      - PORT=3000
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      # S3 (optional — uncomment all 5 required vars together)
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE}
      # RSS (optional — uncomment all to enable)
      - RSS_FEED_URL=${RSS_FEED_URL}
      - PODCAST_TITLE=${PODCAST_TITLE}
      - PODCAST_DESCRIPTION=${PODCAST_DESCRIPTION}
      - PODCAST_LINK=${PODCAST_LINK}
      - PODCAST_AUTHOR=${PODCAST_AUTHOR}
      - PODCAST_LANGUAGE=${PODCAST_LANGUAGE:-en-us}
      - PODCAST_CATEGORIES=${PODCAST_CATEGORIES:-Technology}
    volumes:
      - ./output:/output
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2'
        reservations:
          memory: 256M
          cpus: '0.5'
